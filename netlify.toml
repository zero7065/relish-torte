# Netlify — the website lives in static/; publish it as the site root.
# (static/netlify.toml is kept for drag-and-drop deploys of that folder.)
[build]
  publish = "static"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# /api/* is handled by the single `api` function (state, submissions, admin, images).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Uploaded images are content-addressed by id — cache hard.
[[headers]]
  for = "/api/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Shared site state changes rarely; let the CDN absorb repeat reads.
[[headers]]
  for = "/api/state"
  [headers.values]
    Cache-Control = "public, max-age=10, stale-while-revalidate=120"

# Never cache admin/submission responses.
[[headers]]
  for = "/api/admin/*"
  [headers.values]
    Cache-Control = "no-store"
