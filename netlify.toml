# Netlify — the website lives in static/; publish it as the site root.
# (static/netlify.toml is kept for drag-and-drop deploys of that folder.)
[build]
  publish = "static"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
